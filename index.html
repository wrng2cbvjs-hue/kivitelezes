<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } } };
// ---- állapot ----
let HLT = '', HSONLY = false, QS = '', PEND = null, PKG = null, EL = [], BYK = new Map(), EV = [], ME = LS.get('kk-me') || '', VIEW = 'hs', SHOWALL = false, MULTI = false;
const SEL = new Set(); let ST = new Map();
const CAM = { phi: -0.75, th: 0.5, s: 1, ox: 0, oy: 0, c: [0, 0, 0], fit: false };
const STN = { hs: ['szereletlen', 'konzol felszerelve', 'profil felszerelve'], ps: ['nincs felszerelve', 'panel felszerelve'] };
const evKey = () => 'kk-ev-' + (PKG ? PKG.projekt || 'projekt' : '');
function toast(t, ms) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, ms || 2600); }
// ---- csomag ----
function loadPkg(txt, quiet) {
  let P; try { P = JSON.parse(txt); } catch (e) { toast('A fájl nem olvasható (hibás JSON).'); return false; }
  if (!P || !/^fdb-kigyo-kiadas\//.test(P.format || '') || !Array.isArray(P.elemek)) { toast('Ez nem Kígyó kiadási csomag.'); return false; }
  PKG = P; EL = P.elemek.filter(e => Array.isArray(e.kontur_mm) && e.kontur_mm.length >= 9).map(e => { const g = e.kontur_mm, pts = []; for (let i = 0; i + 2 < g.length; i += 3) pts.push([g[i], g[i + 1], g[i + 2]]); return Object.assign({}, e, { pts: pts }); });
  BYK = new Map(EL.map(e => [e.kulcs, e])); LS.set('kk-pkg', txt);
  try { EV = JSON.parse(LS.get(evKey()) || '[]'); if (!Array.isArray(EV)) EV = []; } catch (e) { EV = []; }
  SEL.clear(); HLT = ''; CAM.fit = false; replay(); ui(); if (PEND) { const k = PEND; PEND = null; setTimeout(() => { if (goTo(k)) toast(BYK.get(k).jel + ' kijelölve (QR)'); }, 60); } else if (!quiet) toast('Betöltve: ' + (P.projekt || '') + ' · rev. ' + P.rev + ' · ' + EL.length + ' elem');
  return true;
}
// ---- napló: csak hozzáírás; az állapot az események időrendjéből ----
function replay() {
  ST = new Map(); const ev = EV.slice().sort((a, b) => a.at.localeCompare(b.at));
  for (const x of ev) { let s = ST.get(x.k); if (!s) { s = { hs: 0, ps: 0, ack: 0, last: 0, n: 0, mm: null, fm: null }; ST.set(x.k, s); } if (x.f === 'hs' || x.f === 'ps') { s[x.f] = x.v; s.last = Math.max(s.last, x.rev || 0); s.n++; } if (x.f === 'ack') s.ack = Math.max(s.ack, x.rev || 0); if (x.f === 'mm' || x.f === 'fm') s[x.f] = x.v ? x : null; }
}
const stOf = k => ST.get(k) || { hs: 0, ps: 0, ack: 0, last: 0, n: 0, mm: null, fm: null };
// tervmódosítás a mostani kiadásban olyan elemen, amelyen korábbi kiadás alapján már volt szerelési jelölés (amíg nincs nyugtázva)
const flagged = e => { if (!PKG || e.valtozas !== 'változott' || e.rev !== PKG.rev) return false; const s = stOf(e.kulcs); return s.n > 0 && s.last < PKG.rev && s.ack < PKG.rev && (s.hs > 0 || s.ps > 0); };
function unsent() { if (SP.on) return EV.filter(x => !x.sync).length; let S; try { S = new Set(JSON.parse(LS.get(evKey() + '-exp') || '[]')); } catch (e) { S = new Set(); } return EV.filter(x => !S.has(x.id)).length; }
function addEv(list) { const now = new Date().toISOString(); for (const x of list) EV.push(Object.assign({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), at: now, by: ME, rev: PKG.rev }, x)); LS.set(evKey(), JSON.stringify(EV)); replay(); ui(); spKick(); }
function setSt(f, v, note) {
  if (!ME) { askName(() => setSt(f, v, note)); return; }
  const T = [...SEL], ev = [], skip = []; let down = false;

      if (!SP.acct) { SP.err = 'login'; ui(); return; }
    } else SP.acct = window.__kkAcct || { name: 'Teszt' };
    ME = SP.acct.name || SP.acct.username || ME; LS.set('kk-me', ME);
    const path = KK_CFG.sitePath ? ':' + (KK_CFG.sitePath[0] === '/' ? '' : '/') + KK_CFG.sitePath : '';
    SP.site = (await gx('/sites/' + KK_CFG.siteHost + path + '?$select=id')).id;
    const L = await gx('/sites/' + SP.site + '/lists?$select=id,displayName,name'), D = await gx('/sites/' + SP.site + '/drives?$select=id,name');
    const li = (L.value || []).find(x => x.displayName === KK_CFG.list || x.name === KK_CFG.list), dr = (D.value || []).find(x => x.name === KK_CFG.lib);
    if (!li || !dr) { SP.miss = (!li ? [KK_CFG.list + ' lista'] : []).concat(!dr ? [KK_CFG.lib + ' tár'] : []); SP.err = 'missing'; ui(); return; }
    SP.list = li.id; SP.drive = dr.id; SP.ready = true; SP.err = '';
    await spPkgs(); if (!PKG && SP.pk.length) await spOpen(SP.pk[0].id); else if (!PKG) { SP.err = 'nopkg'; ui(); } else await spSync();
  } catch (e) { SP.err = e.message || String(e); ui(); }
}
// első beállítás a próbához: a lista (oszlopokkal, indexekkel) és a dokumentumtár létrehozása – csak a webhely tulajdonosa/szerkesztője tudja
async function spSetup() {
  try {
    const L = await gx('/sites/' + SP.site + '/lists?$select=id,displayName,name'), has = n => (L.value || []).some(x => x.displayName === n || x.name === n);
    const col = (name, def, idx) => Object.assign({ name: name }, def, idx ? { indexed: true } : {});
    const body = ix => ({ displayName: KK_CFG.list, list: { template: 'genericList' }, columns: [col('Projekt', { text: {} }, ix), col('Kulcs', { text: { maxLength: 40 } }, ix), col('Mezo', { choice: { choices: ['hs', 'ps', 'ack', 'mm', 'fm'] } }), col('Ertek', { number: {} }), col('Rev', { number: {} }), col('Idopont', { dateTime: {} }, ix), col('Megjegyzes', { text: { allowMultipleLines: true } }), col('Adat', { text: { allowMultipleLines: true, textType: 'plain' } })] });
    if (!has(KK_CFG.list)) { try { await gx('/sites/' + SP.site + '/lists', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body(true)) }); } catch (e) { if (e.status !== 400) throw e; await gx('/sites/' + SP.site + '/lists', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body(false)) }); } }
    if (!has(KK_CFG.lib)) await gx('/sites/' + SP.site + '/lists', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ displayName: KK_CFG.lib, list: { template: 'documentLibrary' } }) });
    toast('Létrehozva: ' + KK_CFG.list + ' lista és ' + KK_CFG.lib + ' tár.'); SP.err = ''; await spInit();
  } catch (e) { toast('A létrehozás nem sikerült: ' + e.message, 6000); }
}
async function spLogin() { if (MSAL) await MSAL.loginRedirect({ scopes: SCOPES }); }
// kiadási csomagok a tárban: projekt + rev a fájlnévből (ZITO_rev2_2026-11-19_14-48.json), a legújabb elöl
async function spPkgs() {
  const r = await gx('/drives/' + SP.drive + '/root/children?$select=id,name,lastModifiedDateTime&$top=500');
  SP.pk = (r.value || []).filter(x => /\.json$/i.test(x.name)).map(x => { const m = /^(.*)_rev(\d+)_/i.exec(x.name) || []; return { id: x.id, name: x.name, proj: m[1] || '', rev: +m[2] || 0, at: x.lastModifiedDateTime }; })
    .sort((a, b) => (PKG && a.proj === PKG.projekt ? 0 : 1) - (PKG && b.proj === PKG.projekt ? 0 : 1) || b.rev - a.rev || String(b.at).localeCompare(String(a.at)));
}
async function spOpen(id) {
  const r = await gx('/drives/' + SP.drive + '/items/' + id + '/content', { raw: true }), txt = await r.text();
  if (loadPkg(txt)) await spSync();
}
// összefésülés: a listán lévő esemény (azonosító = Title) a SharePointé, a helyi még el nem küldöttek maradnak és felmennek
async function spPull() {
  const proj = String(PKG.projekt || '').replace(/'/g, "''"), have = new Map(EV.map(x => [x.id, x]));
  let url = '/sites/' + SP.site + '/lists/' + SP.list + "/items?$expand=fields($select=Title,Projekt,Kulcs,Mezo,Ertek,Rev,Idopont,Megjegyzes,Adat)&$select=id,createdBy,fields&$filter=fields/Projekt eq '" + proj + "'&$top=999", n = 0;
  while (url) {
    const r = await gx(url, { headers: { Prefer: 'HonorNonIndexedQueriesWarningMayFailRandomly' } });
    for (const it of r.value || []) {
      const f = it.fields || {}, id = String(f.Title || ''); if (!id) continue; const by = (it.createdBy && it.createdBy.user && it.createdBy.user.displayName) || '';
      const x = have.get(id); if (x) { if (!x.sync || (by && x.by !== by)) { x.sync = true; if (by) x.by = by; n++; } continue; }
      const e = { id: id, k: String(f.Kulcs || ''), f: String(f.Mezo || ''), v: +f.Ertek || 0, rev: +f.Rev || 0, at: String(f.Idopont || ''), by: by, sync: true }; if (f.Megjegyzes) e.note = String(f.Megjegyzes);
      if (f.Adat) { try { e.mm = JSON.parse(f.Adat); } catch (er) {} }
      if (e.k && e.f && e.at) { EV.push(e); have.set(id, e); n++; }
    }
    url = r['@odata.nextLink'] || '';
  }
  return n;
}
async function spPush() {
  let n = 0;
  for (const x of EV.filter(e => !e.sync)) {
    const fields = { Title: x.id, Projekt: String(PKG.projekt || ''), Kulcs: x.k, Mezo: x.f, Ertek: x.v, Rev: x.rev, Idopont: x.at, Megjegyzes: x.note || '' };
    if (x.mm) fields.Adat = JSON.stringify(x.mm);
    await gx('/sites/' + SP.site + '/lists/' + SP.list + '/items', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: fields }) });
    x.sync = true; n++;
  }
  return n;
}
async function spSync(quiet) {
  if (!SP.ready || !PKG || SP.busy) return; if (navigator.onLine === false) { SP.err = 'offline'; ui(); return; }
  SP.busy = true;
  try { const a = await spPull(), b = await spPush(); LS.set(evKey(), JSON.stringify(EV)); replay(); SP.last = new Date().toISOString(); SP.err = ''; SP.busy = false; ui(); if (!quiet && (a || b)) toast('SharePoint: ' + b + ' elküldve, ' + a + ' új a többiektől'); }
  catch (e) { SP.busy = false; SP.err = e.message || String(e); ui(); }
  finally { SP.busy = false; }
}
const spKick = () => { if (!SP.ready) return; clearTimeout(SP.t); SP.t = setTimeout(() => spSync(true), 400); };
async function spUpload(file) { // tervező: kiadási csomag feltöltése a tárba (csak szerkesztési joggal)
  const txt = await file.text(); let P; try { P = JSON.parse(txt); } catch (e) { toast('A fájl nem olvasható (hibás JSON).'); return; }
  if (!P || !/^fdb-kigyo-kiadas\//.test(P.format || '')) { toast('Ez nem Kígyó kiadási csomag.'); return; }
  try { await gx('/drives/' + SP.drive + '/root:/' + encodeURIComponent(file.name) + ':/content', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: txt }); toast('Feltöltve: ' + file.name); await spPkgs(); SP.err = ''; loadPkg(txt); spKick(); }
  catch (e) { toast('A feltöltés nem sikerült: ' + e.message, 5000); }
}
function spBar() { if (!SP.on) return ''; if (SP.err === 'nopkg') return ' · <span class="warn">nincs kiadás a tárban</span>'; if (SP.err === 'missing') return ' · <span class="warn">hiányzik: ' + esc(SP.miss.join(', ')) + '</span>'; if (SP.err === 'login') return ' · <span class="warn">bejelentkezés szükséges</span>'; if (SP.err === 'offline') return ' · <span class="warn">offline – a jelölések itt várnak</span>'; if (SP.err) return ' · <span class="warn">SharePoint: ' + esc(SP.err) + '</span>'; if (!SP.ready) return ' · SharePoint…'; return ' · SharePoint ' + (SP.busy ? 'szinkron…' : SP.last ? '✓ ' + esc(fmtT(SP.last).slice(-5)) : ''); }
mmBind();
// keresés és QR-mélylink: #k + a kulcs hexában (a Kígyó címkéiről)
const kkCode = k => 'k' + Array.from(k).map(c => c.charCodeAt(0).toString(16).padStart(2, '0')).join('');
const kkDecode = h => { const m = /^#?k((?:[0-9a-f]{2}){3,40})$/i.exec(String(h || '').trim()); if (!m) return null; let k = ''; for (let i = 0; i < m[1].length; i += 2) k += String.fromCharCode(parseInt(m[1].slice(i, i + 2), 16)); return k; };
const norm = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
// felcserélhetőség: azonos tételszám = azonos gyártási forma (méret, alak, dőlés mértéke, élhajlítás, kivágás helye, funkció); a tételszám a kiadás óta rögzített
function swapHtml(e) {
  if (!e.tetel) return '';
  const S = EL.filter(x => x.tetel === e.tetel && x !== e);
  if (!S.length) return '<div class="sw">Egyedi darab – nincs vele felcserélhető.</div>';
  const free = S.filter(x => !stOf(x.kulcs).ps), on = HLT === e.tetel;
  return '<div class="sw">Felcserélhető <b>' + S.length + '</b> azonos darabbal (' + esc(e.tetel) + '), ebből még nincs felszerelve: <b>' + free.length + '</b>' + (PKG.ajtok_osszevonva ? '<br><span class="warn">Az ajtók össze voltak vonva a méret szerinti tétellel: ajtós és sima tábla is lehet köztük.</span>' : '') +
    ' <button class="btn sm" type="button" data-a="hlT" aria-pressed="' + on + '">' + (on ? 'Kiemelés ki' : 'Kiemelés a 3D-ben') + '</button>' +
    '<details><summary>Lista</summary><div class="rq">' + S.slice().sort((a, b) => (stOf(a.kulcs).ps ? 1 : 0) - (stOf(b.kulcs).ps ? 1 : 0) || a.jel.localeCompare(b.jel, 'hu', { numeric: true })).slice(0, 80).map(x => '<button type="button" data-a="go" data-k="' + esc(x.kulcs) + '"><b>' + esc(x.jel) + '</b><small>' + (stOf(x.kulcs).ps ? 'felszerelve' : stOf(x.kulcs).hs === 2 ? 'szerelhető' : 'még nem szerelhető') + '</small></button>').join('') + '</div></details></div>';
}
function srchHtml(q) {
  q = norm(q); if (!q || !PKG) return ''; const ck = kkDecode(q.replace(/^.*#/, ''));
  const L = ck ? EL.filter(e => e.kulcs === ck) : /^t\d+$/.test(q) ? EL.filter(e => norm(e.tetel) === q) : EL.filter(e => norm(e.jel).includes(q));
  if (!L.length) return '<p class="note">Nincs találat.</p>';
  return L.slice(0, 12).map(e => '<button type="button" data-a="go" data-k="' + esc(e.kulcs) + '"><b>' + esc(e.jel) + '</b><small>' + esc(e.meret || '') + '</small></button>').join('') + (L.length > 12 ? '<p class="note">+' + (L.length - 12) + ' további találat – pontosíts.</p>' : '');
}
document.addEventListener('input', e => { if (e.target && e.target.id === 'q') { QS = e.target.value; const r = $('qr'); if (r) r.innerHTML = srchHtml(QS); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && e.target.id === 'q') { const b = document.querySelector('#qr button[data-a="go"]'); if (b) { e.preventDefault(); b.click(); } } });
function fromHash() { const k = kkDecode(location.hash); if (!k) return; if (!PKG) { PEND = k; toast('Előbb töltsd be a kiadási csomagot – utána az elem kijelölődik.', 4000); return; } PEND = null; if (goTo(k)) { const e = BYK.get(k); toast(e.jel); } }
window.addEventListener('hashchange', fromHash);

// ugrás egy elemre: kijelölés, és ha nem látszik, a nézet ráközelít (középre teszi)
function goTo(k) { QS = ''; const e = BYK.get(k); if (!e) { toast('Ez az elem nincs a betöltött kiadásban.'); return false; } SEL.clear(); SEL.add(k); MULTI = false; ui(); const c = [0, 1, 2].map(j => e.pts.reduce((a, p) => a + p[j], 0) / e.pts.length), q = proj(c); if (q[0] < 20 || q[0] > W - 20 || q[1] < 20 || q[1] > H - 20) { CAM.ox += W / 2 - q[0]; CAM.oy += H * 0.4 - q[1]; } draw(); return true; }
const saved = LS.get('kk-pkg'); if (saved) loadPkg(saved, true);
ui(); resize(); setTimeout(fromHash, 80);
$('spUpIn').addEventListener('change', () => { const f = $('spUpIn').files[0]; if (f) spUpload(f); $('spUpIn').value = ''; });
if (SP.on) { spInit(); window.addEventListener('online', spKick); setInterval(() => { if (!document.hidden) spSync(true); }, 60000); }
window.__kk = { sp: () => ({ on: SP.on, ready: SP.ready, err: SP.err, pk: SP.pk.length, unsent: unsent() }), spSync: () => spSync(), loadPkg: loadPkg, sel: k => { SEL.clear(); for (const x of [].concat(k)) SEL.add(x); ui(); }, setSt: setSt, ev: () => EV, st: k => stOf(k), name: n => { ME = n; LS.set('kk-me', n); ui(); }, multi: v => { MULTI = v; ui(); }, keys: () => EL.slice(0, 5).map(e => e.kulcs), hit: (x, y) => hitPoint(x, y), proj: q => proj(q), cam: () => JSON.parse(JSON.stringify(CAM)) };
})();
